# This workflow builds and tests the CMake project natively on Windows using
# MSVC (the Visual Studio toolchain provided by the runner image).
name: windows cmake native test

on:
  push:
    tags: [testing]

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release
  # Use NMake Makefiles instead of the Visual Studio (IDE) generator: the
  # htools subdirectory is added with EXCLUDE_FROM_ALL, which excludes its
  # targets from Visual Studio solution/project files. NMake Makefiles is a
  # non-IDE (single-configuration) generator and keeps every target buildable.
  CMAKE_GENERATOR: NMake Makefiles
  # NMake Makefiles is single-configuration. Export the build type so that the
  # nested htools builds (which do not pass CMAKE_BUILD_TYPE) also use Release.
  CMAKE_BUILD_TYPE: Release

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Setup MSVC environment
        # NMake Makefiles needs the MSVC developer environment (cl, nmake).
        # Detect the installed Visual Studio instance and import the variables
        # configured by vcvars64.bat into later steps. The detected version is
        # also used for the msvcXXXX part of the release asset names.
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vsPath = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          $vsVersion = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationVersion
          if (-not $vsPath -or -not $vsVersion) {
            throw 'No Visual Studio installation with the MSVC toolchain was found.'
          }

          $vsMajor = [int]($vsVersion.Split('.')[0])
          $vsYear = switch ($vsMajor) {
            16 { '2019' }
            17 { '2022' }
            18 { '2026' }
            default { throw "Unsupported Visual Studio version: $vsVersion" }
          }
          "MSVC_VERSION=msvc$vsYear" >> $env:GITHUB_ENV
          Write-Host "MSVC toolchain: $vsVersion (Visual Studio $vsMajor $vsYear)"

          $vcvars = Join-Path $vsPath 'VC\Auxiliary\Build\vcvars64.bat'
          if (-not (Test-Path $vcvars)) {
            throw "vcvars64.bat not found: $vcvars"
          }

          # Run vcvars64.bat in cmd and copy the resulting environment into
          # GITHUB_ENV. GitHub's reserved variables must not be overwritten.
          $batFile = Join-Path $env:RUNNER_TEMP 'setup-msvc.bat'
          Set-Content -Path $batFile -Encoding ASCII `
            -Value "@call `"$vcvars`" >nul`r`n@set"
          $skip = '^(GITHUB_|RUNNER_|ACTIONS_|INPUT_|STATE_)'
          cmd /c $batFile | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$' -and $Matches[1] -notmatch $skip) {
              "$($Matches[1])=$($Matches[2])" >> $env:GITHUB_ENV
            }
          }
          Remove-Item $batFile -Force

      # Note: unlike the Ubuntu workflow, the Windows runner has no
      # pkg-config based third-party libraries (wxWidgets, OpenCV, freetype,
      # libserialport, libevent), so the tools depending on them are skipped
      # by htools/common/CheckExternalLibrariesAndTools.cmake.

      - name: Configure CMake
        # Configure CMake in a 'build' subdirectory. CMAKE_BUILD_TYPE is used
        # by the single-configuration NMake Makefiles generator.
        # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html
        # CMAKE_INSTALL_PREFIX is redirected into the build tree so that the
        # install step does not need write access to Program Files.
        shell: pwsh
        run: >-
          cmake -B "${env:GITHUB_WORKSPACE}/build"
          -G "$env:CMAKE_GENERATOR"
          -DCMAKE_BUILD_TYPE=$env:BUILD_TYPE
          -DCMAKE_INSTALL_PREFIX="${env:GITHUB_WORKSPACE}/build/install"
          test

      - name: Build
        # Build your program with the given configuration
        shell: pwsh
        run: >-
          cmake --build "${env:GITHUB_WORKSPACE}/build" &&
          cmake --build "${env:GITHUB_WORKSPACE}/build" -t htools

      - name: Test
        working-directory: ${{ github.workspace }}/build
        shell: pwsh
        run: |
          & "./HBoxTest/HBoxTest.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "./HRCTest/HRCTest.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "./HCPPObjectTest/HCPPObjectTest.exe"
          exit $LASTEXITCODE

      - name: Install
        # The test project installs its targets into ${CMAKE_BINARY_DIR}/test
        # (bin/ and lib/). Third-party install rules go to the redirected
        # CMAKE_INSTALL_PREFIX inside the build tree.
        shell: pwsh
        run: >-
          cmake --build "${env:GITHUB_WORKSPACE}/build" --target install

      - name: Resolve release asset name
        # Only publish from pushes to master; pull requests from forks have a
        # read-only GITHUB_TOKEN and cannot upload release assets.
        # The name is derived at runtime from the runner OS/architecture and
        # the detected Visual Studio (MSVC) toolchain, e.g.
        # htools-windows-msvc2026-x64-snapshot.zip and
        # test-windows-msvc2026-x64-snapshot.zip.
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $os = ${env:RUNNER_OS}.ToLowerInvariant()
          $arch = ${env:RUNNER_ARCH}.ToLowerInvariant()
          $suffix = "$os-$($env:MSVC_VERSION)-$arch-snapshot.zip"
          "HTOOLS_ASSET=htools-$suffix" >> $env:GITHUB_ENV
          "TEST_ASSET=test-$suffix" >> $env:GITHUB_ENV
          Write-Host "Release assets: htools-$suffix, test-$suffix"

      - name: Package htools
        # Use the tar command shipped with Windows (C:\Windows\System32\tar.exe,
        # bsdtar); `-a` selects the zip format from the .zip extension. Call it
        # by full path because the GNU tar bundled with Git (which cannot create
        # zip archives) may also be present on PATH.
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $tar = Join-Path $env:SystemRoot 'System32\tar.exe'
          & $tar -C "${env:GITHUB_WORKSPACE}/build" `
            -a -c -f "${env:GITHUB_WORKSPACE}/${env:HTOOLS_ASSET}" htools
          exit $LASTEXITCODE

      - name: Package test
        # Package the test project's install tree (${CMAKE_BINARY_DIR}/test).
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $tar = Join-Path $env:SystemRoot 'System32\tar.exe'
          & $tar -C "${env:GITHUB_WORKSPACE}/build" `
            -a -c -f "${env:GITHUB_WORKSPACE}/${env:TEST_ASSET}" test
          exit $LASTEXITCODE

      - name: Upload snapshots to testing release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: >-
          gh release upload testing
          "${env:GITHUB_WORKSPACE}/${env:HTOOLS_ASSET}"
          "${env:GITHUB_WORKSPACE}/${env:TEST_ASSET}"
          --clobber
