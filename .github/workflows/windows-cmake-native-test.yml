# This workflow builds and tests the CMake project natively on Windows using
# MSVC (the Visual Studio toolchain provided by the runner image).
name: windows cmake native test

on:
  push:
    tags: [testing]

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release
  # Use NMake Makefiles instead of the Visual Studio (IDE) generator: the
  # htools subdirectory is added with EXCLUDE_FROM_ALL, which excludes its
  # targets from Visual Studio solution/project files. NMake Makefiles is a
  # non-IDE (single-configuration) generator and keeps every target buildable.
  CMAKE_GENERATOR: NMake Makefiles
  # NMake Makefiles is single-configuration. Export the build type so that the
  # nested htools builds (which do not pass CMAKE_BUILD_TYPE) also use Release.
  CMAKE_BUILD_TYPE: Release
  # vcpkg triplet used for the third-party libraries. The dynamic variant
  # (x64-windows) is required so the runtime DLLs can be packaged.
  VCPKG_TRIPLET: x64-windows

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        # Retry once if the initial clone/fetch fails due to a network error.
        id: checkout
        uses: actions/checkout@v5
        continue-on-error: true

      - name: Checkout (retry)
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@v5

      - name: Setup MSVC environment
        # NMake Makefiles needs the MSVC developer environment (cl, nmake).
        # Detect the installed Visual Studio instance and import the variables
        # configured by vcvars64.bat into later steps. The detected version is
        # also used for the msvcXXXX part of the release asset names.
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vsPath = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          $vsVersion = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationVersion
          if (-not $vsPath -or -not $vsVersion) {
            throw 'No Visual Studio installation with the MSVC toolchain was found.'
          }

          $vsMajor = [int]($vsVersion.Split('.')[0])
          $vsYear = switch ($vsMajor) {
            16 { '2019' }
            17 { '2022' }
            18 { '2026' }
            default { throw "Unsupported Visual Studio version: $vsVersion" }
          }
          "MSVC_VERSION=msvc$vsYear" >> $env:GITHUB_ENV
          Write-Host "MSVC toolchain: $vsVersion (Visual Studio $vsMajor $vsYear)"

          $vcvars = Join-Path $vsPath 'VC\Auxiliary\Build\vcvars64.bat'
          if (-not (Test-Path $vcvars)) {
            throw "vcvars64.bat not found: $vcvars"
          }

          # Run vcvars64.bat in cmd and copy the resulting environment into
          # GITHUB_ENV. GitHub's reserved variables must not be overwritten.
          $batFile = Join-Path $env:RUNNER_TEMP 'setup-msvc.bat'
          Set-Content -Path $batFile -Encoding ASCII `
            -Value "@call `"$vcvars`" >nul`r`n@set"
          $skip = '^(GITHUB_|RUNNER_|ACTIONS_|INPUT_|STATE_)'
          cmd /c $batFile | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$' -and $Matches[1] -notmatch $skip) {
              "$($Matches[1])=$($Matches[2])" >> $env:GITHUB_ENV
            }
          }
          Remove-Item $batFile -Force

      - name: Install vcpkg dependencies
        # libserialport is not in the official vcpkg registry, so it is
        # provided by the local overlay port under .github/vcpkg-ports/.
        # pkgconf is installed because htools detects freetype and
        # libserialport with pkg-config.
        # Only the OpenCV modules used by imageresourcegenerate are enabled
        # (core/imgproc/imgcodecs are always built; only image codecs are
        # selectable features) to avoid the heavy default dnn/gapi features.
        # TIFF is deliberately not enabled: its find_dependency() makes the
        # OpenCV export fail with "cmake_policy PUSH without matching POP"
        # when TIFF is not resolved in this project context (OpenCV 4.14).
        shell: pwsh
        env:
          VCPKG_DISABLE_METRICS: "1"
          # Only the Release configuration is built/needed here.
          VCPKG_BUILD_TYPE: release
        run: |
          # vcvars64.bat points VCPKG_ROOT at the Visual Studio bundled copy;
          # align it with the vcpkg used by this workflow.
          $env:VCPKG_ROOT = $env:VCPKG_INSTALLATION_ROOT
          $vcpkg = Join-Path $env:VCPKG_INSTALLATION_ROOT 'vcpkg.exe'

          # vcpkg downloads many archives (GitHub, GitLab, MSYS2, ...). Retry
          # transient network failures; already-built packages are resumed on
          # the next attempt.
          # pcre2 is promoted to a direct request with [core] so wxWidgets does
          # not enable its JIT feature, which needs an api.github.com gitlink
          # lookup (rate limited on shared runner IPs).
          $maxAttempts = 5
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            Write-Host "vcpkg install: attempt $attempt of $maxAttempts"
            & $vcpkg install `
              "opencv4[core,jpeg,png,webp]" `
              "wxwidgets[webview]" freetype libserialport pkgconf `
              "pcre2[core]" `
              --triplet $env:VCPKG_TRIPLET `
              --overlay-ports="${env:GITHUB_WORKSPACE}/.github/vcpkg-ports" `
              --clean-after-build
            if ($LASTEXITCODE -eq 0) {
              break
            }
            if ($attempt -eq $maxAttempts) {
              Write-Host "vcpkg install failed after $maxAttempts attempts."
              exit $LASTEXITCODE
            }
            $delay = 30 * $attempt
            Write-Warning "vcpkg install failed (exit $LASTEXITCODE); retrying in $delay seconds."
            Start-Sleep -Seconds $delay
          }

          $root = $env:VCPKG_INSTALLATION_ROOT -replace '\\', '/'
          $installed = "$root/installed/$env:VCPKG_TRIPLET"
          # Make the vcpkg toolchain available to the nested htools builds too.
          "CMAKE_TOOLCHAIN_FILE=$root/scripts/buildsystems/vcpkg.cmake" >> $env:GITHUB_ENV
          "VCPKG_DEFAULT_TRIPLET=$env:VCPKG_TRIPLET" >> $env:GITHUB_ENV
          "VCPKG_ROOT=$root" >> $env:GITHUB_ENV
          # pkgconf provides pkg-config, which htools uses for freetype and
          # libserialport detection.
          "PKG_CONFIG=$installed/tools/pkgconf/pkgconf.exe" >> $env:GITHUB_ENV
          "PKG_CONFIG_PATH=$installed/lib/pkgconfig;$installed/share/pkgconfig" >> $env:GITHUB_ENV
          # Required to run tools/tests that link against vcpkg libraries.
          "$installed/bin" >> $env:GITHUB_PATH
          "$installed/tools/pkgconf" >> $env:GITHUB_PATH

      - name: Configure CMake
        # Configure CMake in a 'build' subdirectory. CMAKE_BUILD_TYPE is used
        # by the single-configuration NMake Makefiles generator.
        # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html
        # CMAKE_INSTALL_PREFIX is redirected into the build tree so that the
        # install step does not need write access to Program Files.
        shell: pwsh
        run: >-
          cmake -B "${env:GITHUB_WORKSPACE}/build"
          -G "$env:CMAKE_GENERATOR"
          -DCMAKE_TOOLCHAIN_FILE="$env:CMAKE_TOOLCHAIN_FILE"
          -DVCPKG_TARGET_TRIPLET=$env:VCPKG_TRIPLET
          -DCMAKE_BUILD_TYPE=$env:BUILD_TYPE
          -DCMAKE_INSTALL_PREFIX="${env:GITHUB_WORKSPACE}/build/install"
          test

      - name: Build
        # Build your program with the given configuration
        shell: pwsh
        run: >-
          cmake --build "${env:GITHUB_WORKSPACE}/build" &&
          cmake --build "${env:GITHUB_WORKSPACE}/build" -t htools

      - name: Test
        working-directory: ${{ github.workspace }}/build
        shell: pwsh
        run: |
          & "./HBoxTest/HBoxTest.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "./HRCTest/HRCTest.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "./HCPPObjectTest/HCPPObjectTest.exe"
          exit $LASTEXITCODE

      - name: Install
        # The test project installs its targets into ${CMAKE_BINARY_DIR}/test
        # (bin/ and lib/). Third-party install rules go to the redirected
        # CMAKE_INSTALL_PREFIX inside the build tree.
        shell: pwsh
        run: >-
          cmake --build "${env:GITHUB_WORKSPACE}/build" --target install

      - name: Copy vcpkg runtime DLLs
        # The htools executables are installed into build/htools/bin. Copy the
        # runtime DLLs of the vcpkg libraries next to them so the packaged
        # tools are self-contained (OpenCV, wxWidgets, freetype,
        # libserialport and their dependencies).
        shell: pwsh
        run: |
          $src = Join-Path $env:VCPKG_INSTALLATION_ROOT "installed/$env:VCPKG_TRIPLET/bin"
          $dst = Join-Path $env:GITHUB_WORKSPACE 'build/htools/bin'
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Copy-Item -Path (Join-Path $src '*.dll') -Destination $dst -Force
          Get-ChildItem -Path $dst -Filter '*.dll' |
            Select-Object -ExpandProperty Name

      - name: Resolve release asset name
        # Only publish from pushes to master; pull requests from forks have a
        # read-only GITHUB_TOKEN and cannot upload release assets.
        # The name is derived at runtime from the runner OS/architecture and
        # the detected Visual Studio (MSVC) toolchain, e.g.
        # htools-windows-msvc2026-x64-snapshot.zip and
        # test-windows-msvc2026-x64-snapshot.zip.
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $os = ${env:RUNNER_OS}.ToLowerInvariant()
          $arch = ${env:RUNNER_ARCH}.ToLowerInvariant()
          $suffix = "$os-$($env:MSVC_VERSION)-$arch-snapshot.zip"
          "HTOOLS_ASSET=htools-$suffix" >> $env:GITHUB_ENV
          "TEST_ASSET=test-$suffix" >> $env:GITHUB_ENV
          Write-Host "Release assets: htools-$suffix, test-$suffix"

      - name: Package htools
        # Use the tar command shipped with Windows (C:\Windows\System32\tar.exe,
        # bsdtar); `-a` selects the zip format from the .zip extension. Call it
        # by full path because the GNU tar bundled with Git (which cannot create
        # zip archives) may also be present on PATH.
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $tar = Join-Path $env:SystemRoot 'System32\tar.exe'
          & $tar -C "${env:GITHUB_WORKSPACE}/build" `
            -a -c -f "${env:GITHUB_WORKSPACE}/${env:HTOOLS_ASSET}" htools
          exit $LASTEXITCODE

      - name: Package test
        # Package the test project's install tree (${CMAKE_BINARY_DIR}/test).
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $tar = Join-Path $env:SystemRoot 'System32\tar.exe'
          & $tar -C "${env:GITHUB_WORKSPACE}/build" `
            -a -c -f "${env:GITHUB_WORKSPACE}/${env:TEST_ASSET}" test
          exit $LASTEXITCODE

      - name: Upload snapshots to testing release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $maxAttempts = 5
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            Write-Host "gh release upload: attempt $attempt of $maxAttempts"
            & gh release upload testing `
              "${env:GITHUB_WORKSPACE}/${env:HTOOLS_ASSET}" `
              "${env:GITHUB_WORKSPACE}/${env:TEST_ASSET}" `
              --clobber
            if ($LASTEXITCODE -eq 0) {
              break
            }
            if ($attempt -eq $maxAttempts) {
              Write-Host "gh release upload failed after $maxAttempts attempts."
              exit $LASTEXITCODE
            }
            $delay = 10 * $attempt
            Write-Warning "gh release upload failed (exit $LASTEXITCODE); retrying in $delay seconds."
            Start-Sleep -Seconds $delay
          }
