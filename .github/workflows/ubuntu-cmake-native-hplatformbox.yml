# This workflow builds the hplatformbox firmware natively on Ubuntu.
name: ubuntu cmake native hplatformbox test

on:
  push:
    tags: [testing]

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/zephyrproject-rtos/ci:main
      # The image's default user does not own the runner workspace.
      options: --user root
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Mark workspace as safe for git
        # The container runs as root while the mounted workspace is owned by the
        # runner user; git (used by gh and by CMake) refuses such repositories.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install sdcc riscv64-unknown-elf-gcc and gh
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y -f sdcc gcc-riscv64-unknown-elf picolibc-riscv64-unknown-elf gh

      - name: Prepare Zephyr
        run: |
          # Only the RISC-V toolchain from the image is used, so fetch just the
          # Zephyr sources (no west modules) to keep the workspace small.
          git clone --depth 1 --branch main \
            https://github.com/zephyrproject-rtos/zephyr /opt/zephyrproject/zephyr
          cd /opt/zephyrproject/zephyr
          west init -l .
          west zephyr-export
          # The image registers its Zephyr SDK CMake package for the default
          # user only, so point CMake at the SDK explicitly when running as root.
          echo "ZEPHYR_SDK_INSTALL_DIR=$(ls -d /opt/toolchains/zephyr-sdk-* | head -n 1)" >> "$GITHUB_ENV"
          echo "ZEPHYR_BASE=/opt/zephyrproject/zephyr" >> "$GITHUB_ENV"

      - name: Configure CMake
        # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only
        # required if you are using a single-configuration generator such as make.
        # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html
        run: >-
          cmake -B ${{ github.workspace }}/build
          -DBUILD_HPLATFORMBOX_RISCV_SIM_ZEPHYR=ON
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} test

      - name: Build
        # Build your program with the given configuration
        run: >-
          cmake --build ${{ github.workspace }}/build
          --config ${{ env.BUILD_TYPE }} -t hplatformbox

      - name: Package hplatformbox
        # Only publish from pushes to master; pull requests from forks have a
        # read-only GITHUB_TOKEN and cannot upload release assets.
        if: github.event_name == 'push'
        run: >-
          tar -C ${{ github.workspace }}/build
          -czf hplatformbox-snapshot.tar.gz hplatformbox

      - name: Upload snapshot to testing release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release upload testing hplatformbox-snapshot.tar.gz
          --clobber
