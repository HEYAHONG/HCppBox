# This workflow builds and tests the CMake project natively on Ubuntu.
name: ubuntu cmake native test

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Install lib
      run: sudo apt-get update &&  sudo apt-get install -f libopencv-dev  libfreetype-dev libwx*dev libx11-dev libxext-dev libxkbcommon-dev libwayland-dev libserialport-dev

    - name: Configure CMake
      # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
      # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} test

    - name: Build
      # Build your program with the given configuration
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}} &&  cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}} -t htools

    - name: Test
      working-directory: ${{github.workspace}}/build
      run: ${{github.workspace}}/build/HBoxTest/HBoxTest && ${{github.workspace}}/build/HRCTest/HRCTest && ${{github.workspace}}/build/HCPPObjectTest/HCPPObjectTest
