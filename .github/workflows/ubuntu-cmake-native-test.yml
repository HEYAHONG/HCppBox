# This workflow builds and tests the CMake project natively on Ubuntu.
name: ubuntu cmake native test

on:
  push:
    tags: [testing]

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Install lib
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y -f libopencv-dev libfreetype-dev libwx*dev
          libx11-dev libxext-dev libxkbcommon-dev libwayland-dev
          libserialport-dev

      - name: Configure CMake
        # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only
        # required if you are using a single-configuration generator such as make.
        # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html
        run: >-
          cmake -B ${{ github.workspace }}/build
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} test

      - name: Build
        # Build your program with the given configuration
        run: >-
          cmake --build ${{ github.workspace }}/build
          --config ${{ env.BUILD_TYPE }} &&
          cmake --build ${{ github.workspace }}/build
          --config ${{ env.BUILD_TYPE }} -t htools

      - name: Test
        working-directory: ${{ github.workspace }}/build
        run: >-
          ${{ github.workspace }}/build/HBoxTest/HBoxTest &&
          ${{ github.workspace }}/build/HRCTest/HRCTest &&
          ${{ github.workspace }}/build/HCPPObjectTest/HCPPObjectTest

      - name: Resolve release asset name
        # Only publish from pushes to master; pull requests from forks have a
        # read-only GITHUB_TOKEN and cannot upload release assets.
        if: github.event_name == 'push'
        run: |
          . /etc/os-release
          echo "RELEASE_ASSET=htools-${ID}-${VERSION_ID}-snapshot.tar.gz" >> "$GITHUB_ENV"

      - name: Package htools
        if: github.event_name == 'push'
        run: >-
          tar -C ${{ github.workspace }}/build
          -czf ${{ env.RELEASE_ASSET }} htools

      - name: Upload snapshot to testing release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release upload testing ${{ env.RELEASE_ASSET }}
          --clobber
