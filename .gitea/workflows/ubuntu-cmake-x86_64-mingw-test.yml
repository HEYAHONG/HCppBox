# This workflow cross-compiles the CMake project for x86_64 Windows
# (MinGW-w64) on Ubuntu. The produced binaries cannot be executed on the
# runner, so only the build and install steps are verified (no test run).
name: ubuntu cmake x86_64 mingw test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Install cmake build-essential
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y -f cmake build-essential

      - name: Install x86_64 MinGW-w64 toolchain
        # Cross-compiling for Windows: the host (Linux) -dev packages are not
        # usable for the Windows target, so only the MinGW-w64 cross toolchain
        # is installed here.
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y -f gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64
          make ninja-build

      - name: Configure CMake(x86_64 mingw)
        # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only
        # required if you are using a single-configuration generator such as make.
        # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html
        # CMAKE_INSTALL_PREFIX is redirected into the build tree so that the
        # install step does not need write access to /usr/local.
        env:
          LDFLAGS: -static -static-libgcc -static-libstdc++
        run: >-
          cmake -B ${{ gitea.workspace }}/build-mingw-x86_64
          -DCMAKE_TOOLCHAIN_FILE=${{ gitea.workspace }}/test/cmake/toolchain-x86_64-mingw.cmake
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
          -DCMAKE_INSTALL_PREFIX=${{ gitea.workspace }}/build-mingw-x86_64/install
          test

      - name: Build(x86_64 mingw)
        # Build your program with the given configuration
        run: >-
          cmake --build ${{ gitea.workspace }}/build-mingw-x86_64
          --config ${{ env.BUILD_TYPE }}

      - name: Install(x86_64 mingw)
        # The test project installs its targets into
        # ${CMAKE_BINARY_DIR}/test (bin/ and lib/).
        run: >-
          cmake --build ${{ gitea.workspace }}/build-mingw-x86_64
          --config ${{ env.BUILD_TYPE }} --target install

      - name: Resolve release asset name
        if: gitea.event_name == 'push'
        run: |
          echo "RELEASE_ASSET=test-mingw-x86_64-snapshot.tar.gz" >> "$GITEA_ENV"

      - name: Package test
        if: gitea.event_name == 'push'
        run: >-
          tar -C ${{ gitea.workspace }}/build-mingw-x86_64
          -czf ${{ env.RELEASE_ASSET }} test

      - name: Upload snapshot to testing release
        if: gitea.event_name == 'push'
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          set -eu
          api="${{ gitea.server_url }}/api/v1/repos/${{ gitea.repository }}"
          asset="${{ env.RELEASE_ASSET }}"
          auth="Authorization: token $GITEA_TOKEN"
          release_id=$(curl -fsS -H "$auth" "$api/releases/tags/testing" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          asset_id=$(curl -fsS -H "$auth" "$api/releases/$release_id/assets" \
            | python3 -c 'import json,sys
          name = sys.argv[1]
          print(next((a["id"] for a in json.load(sys.stdin) if a["name"] == name), ""))' \
              "$asset")
          if [ -n "$asset_id" ]; then
            curl -fsS -X DELETE -H "$auth" "$api/releases/$release_id/assets/$asset_id"
          fi
          curl -fsS -X POST -H "$auth" -F "attachment=@$asset" "$api/releases/$release_id/assets?name=$asset"
