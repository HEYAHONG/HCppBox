# This workflow cross-compiles and tests the CMake project for aarch64 on
# Ubuntu (via qemu-user).
name: ubuntu cmake aarch64 test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install lib
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y -f libopencv-dev libfreetype-dev libwx*dev
          libx11-dev libxext-dev libxkbcommon-dev libwayland-dev
          libserialport-dev

      - name: Install aarch64 toolchain
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y -f gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          qemu-user

      - name: Configure CMake(aarch64)
        # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only
        # required if you are using a single-configuration generator such as make.
        # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html
        env:
          LDFLAGS: -static -static-libgcc -static-libstdc++
        run: >-
          cmake -B ${{ gitea.workspace }}/build-aarch64
          -DCMAKE_TOOLCHAIN_FILE=${{ gitea.workspace }}/test/cmake/toolchain-aarch64.cmake
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} test

      - name: Build(aarch64)
        # Build your program with the given configuration
        run: >-
          cmake --build ${{ gitea.workspace }}/build-aarch64
          --config ${{ env.BUILD_TYPE }}

      - name: Test
        working-directory: ${{ gitea.workspace }}/build-aarch64
        run: >-
          qemu-aarch64 ${{ gitea.workspace }}/build-aarch64/HBoxTest/HBoxTest &&
          qemu-aarch64 ${{ gitea.workspace }}/build-aarch64/HRCTest/HRCTest &&
          qemu-aarch64 ${{ gitea.workspace }}/build-aarch64/HCPPObjectTest/HCPPObjectTest
