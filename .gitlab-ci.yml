# GitLab CI mirror of the GitHub Actions workflows in .github/workflows.
# Jobs run in the official Ubuntu image (root), so sudo is not needed.
# The "testing" release assets are stored in the GitLab generic package
# registry, so a rerun replaces the previous snapshot instead of failing.

stages:
  - build
  - release

variables:
  BUILD_TYPE: Release
  DEBIAN_FRONTEND: noninteractive
  GIT_DEPTH: "0"
  PKG_NAME: hcppbox

default:
  image: ubuntu:24.04

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "master"'

.base:
  before_script:
    - apt-get update
    - >-
      apt-get install -y -f --no-install-recommends
      ca-certificates curl git python3 build-essential cmake

.libs:
  before_script:
    - >-
      apt-get install -y -f --no-install-recommends
      libopencv-dev libfreetype-dev libwx*dev libx11-dev libxext-dev
      libxkbcommon-dev libwayland-dev libserialport-dev

# ---------------------------------------------------------------------------
# CMake native (mirror of ubuntu-cmake-native-test.yml)
# ---------------------------------------------------------------------------
cmake-native:
  stage: build
  before_script:
    - !reference [.base, before_script]
    - !reference [.libs, before_script]
  script:
    - cmake -B build -DCMAKE_BUILD_TYPE=$BUILD_TYPE test
    - cmake --build build --config $BUILD_TYPE
    - cmake --build build --config $BUILD_TYPE -t htools
    - ./build/HBoxTest/HBoxTest
    - ./build/HRCTest/HRCTest
    - ./build/HCPPObjectTest/HCPPObjectTest
    - . /etc/os-release
    - mkdir -p dist
    - tar -C build -czf "dist/htools-${ID}-${VERSION_ID}-snapshot.tar.gz" htools
  artifacts:
    paths:
      - dist/
    expire_in: never

# ---------------------------------------------------------------------------
# CMake i686 (mirror of ubuntu-cmake-i686-test.yml)
# ---------------------------------------------------------------------------
cmake-i686:
  stage: build
  variables:
    LDFLAGS: -static -static-libgcc -static-libstdc++
  before_script:
    - !reference [.base, before_script]
    - !reference [.libs, before_script]
    - >-
      apt-get install -y -f --no-install-recommends
      gcc-i686-linux-gnu g++-i686-linux-gnu make ninja-build qemu-user
  script:
    - >-
      cmake -B build-x86
      -DCMAKE_TOOLCHAIN_FILE="$CI_PROJECT_DIR/test/cmake/toolchain-i686.cmake"
      -DCMAKE_BUILD_TYPE=$BUILD_TYPE test
    - cmake --build build-x86 --config $BUILD_TYPE
    - qemu-i386 ./build-x86/HBoxTest/HBoxTest
    - qemu-i386 ./build-x86/HRCTest/HRCTest
    - qemu-i386 ./build-x86/HCPPObjectTest/HCPPObjectTest

# ---------------------------------------------------------------------------
# CMake i686 MinGW-w64 (mirror of ubuntu-cmake-i686-mingw-test.yml)
# ---------------------------------------------------------------------------
cmake-i686-mingw:
  stage: build
  variables:
    LDFLAGS: -static -static-libgcc -static-libstdc++
  before_script:
    - !reference [.base, before_script]
    - >-
      apt-get install -y -f --no-install-recommends
      gcc-mingw-w64-i686 g++-mingw-w64-i686 make ninja-build
  script:
    - >-
      cmake -B build-mingw-i686
      -DCMAKE_TOOLCHAIN_FILE="$CI_PROJECT_DIR/test/cmake/toolchain-i686-mingw.cmake"
      -DCMAKE_BUILD_TYPE=$BUILD_TYPE
      -DCMAKE_INSTALL_PREFIX="$CI_PROJECT_DIR/build-mingw-i686/install" test
    - cmake --build build-mingw-i686 --config $BUILD_TYPE
    - cmake --build build-mingw-i686 --config $BUILD_TYPE --target install
    - mkdir -p dist
    - tar -C build-mingw-i686 -czf dist/test-mingw-i686-snapshot.tar.gz test
  artifacts:
    paths:
      - dist/
    expire_in: never

# ---------------------------------------------------------------------------
# CMake x86_64 MinGW-w64 (mirror of ubuntu-cmake-x86_64-mingw-test.yml)
# ---------------------------------------------------------------------------
cmake-x86_64-mingw:
  stage: build
  variables:
    LDFLAGS: -static -static-libgcc -static-libstdc++
  before_script:
    - !reference [.base, before_script]
    - >-
      apt-get install -y -f --no-install-recommends
      gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 make ninja-build
  script:
    - >-
      cmake -B build-mingw-x86_64
      -DCMAKE_TOOLCHAIN_FILE="$CI_PROJECT_DIR/test/cmake/toolchain-x86_64-mingw.cmake"
      -DCMAKE_BUILD_TYPE=$BUILD_TYPE
      -DCMAKE_INSTALL_PREFIX="$CI_PROJECT_DIR/build-mingw-x86_64/install" test
    - cmake --build build-mingw-x86_64 --config $BUILD_TYPE
    - cmake --build build-mingw-x86_64 --config $BUILD_TYPE --target install
    - mkdir -p dist
    - tar -C build-mingw-x86_64 -czf dist/test-mingw-x86_64-snapshot.tar.gz test
  artifacts:
    paths:
      - dist/
    expire_in: never

# ---------------------------------------------------------------------------
# CMake aarch64 (mirror of ubuntu-cmake-aarch64-test.yml)
# ---------------------------------------------------------------------------
cmake-aarch64:
  stage: build
  variables:
    LDFLAGS: -static -static-libgcc -static-libstdc++
  before_script:
    - !reference [.base, before_script]
    - !reference [.libs, before_script]
    - >-
      apt-get install -y -f --no-install-recommends
      gcc-aarch64-linux-gnu g++-aarch64-linux-gnu qemu-user
  script:
    - >-
      cmake -B build-aarch64
      -DCMAKE_TOOLCHAIN_FILE="$CI_PROJECT_DIR/test/cmake/toolchain-aarch64.cmake"
      -DCMAKE_BUILD_TYPE=$BUILD_TYPE test
    - cmake --build build-aarch64 --config $BUILD_TYPE
    - qemu-aarch64 ./build-aarch64/HBoxTest/HBoxTest
    - qemu-aarch64 ./build-aarch64/HRCTest/HRCTest
    - qemu-aarch64 ./build-aarch64/HCPPObjectTest/HCPPObjectTest

# ---------------------------------------------------------------------------
# SCons native (mirror of ubuntu-scons-native-test.yml)
# ---------------------------------------------------------------------------
scons-native:
  stage: build
  before_script:
    - !reference [.base, before_script]
    - !reference [.libs, before_script]
    - apt-get install -y -f --no-install-recommends python3-pip
  script:
    - pip3 install --break-system-packages scons
    - cd test && scons

# ---------------------------------------------------------------------------
# hplatformbox firmware (mirror of ubuntu-cmake-native-hplatformbox.yml)
# ---------------------------------------------------------------------------
cmake-native-hplatformbox:
  stage: build
  before_script:
    - !reference [.base, before_script]
    - >-
      apt-get install -y -f --no-install-recommends
      sdcc gcc-riscv64-unknown-elf picolibc-riscv64-unknown-elf
  script:
    - cmake -B build -DCMAKE_BUILD_TYPE=$BUILD_TYPE test
    - cmake --build build --config $BUILD_TYPE -t hplatformbox
    - mkdir -p dist
    - tar -C build -czf dist/hplatformbox-snapshot.tar.gz hplatformbox
  artifacts:
    paths:
      - dist/
    expire_in: never

# ---------------------------------------------------------------------------
# Releases
# ---------------------------------------------------------------------------
.release:
  stage: release
  before_script:
    - !reference [.base, before_script]
  rules:
    - if: '$CI_COMMIT_BRANCH == "master" && $CI_PIPELINE_SOURCE == "push"'
  script:
    - |
      set -eu
      # 只把文件名用于制品 URL，避免把 dist/ 目录带进包注册表和 Release 链接。
      ASSET_PATH=$(ls dist/*.tar.gz 2>/dev/null | head -n 1)
      if [ -z "$ASSET_PATH" ]; then
        echo "dist/ 中没有可发布的制品文件" >&2
        exit 1
      fi
      ASSET_NAME=$(basename "$ASSET_PATH")
      PKG_VERSION=testing
      API="$CI_API_V4_URL/projects/$CI_PROJECT_ID"
      AUTH="JOB-TOKEN: $CI_JOB_TOKEN"
      PKG_URL="$API/packages/generic/$PKG_NAME/$PKG_VERSION/$ASSET_NAME"

      # 删除同名制品包（连同其中的旧文件），实现“覆盖上次的发布文件”。
      pkg_ids=$(curl -fsS --header "$AUTH" \
          "$API/packages?package_name=$PKG_NAME&package_version=$PKG_VERSION" \
          | python3 -c 'import json,sys; print(" ".join(str(p["id"]) for p in json.load(sys.stdin)))')
      for pkg_id in $pkg_ids; do
        curl -fsS --request DELETE --header "$AUTH" "$API/packages/$pkg_id"
      done

      # 上传新的制品文件到通用包注册表。
      curl -fsS --header "$AUTH" --upload-file "$ASSET_PATH" "$PKG_URL"

      # 确保 testing Release 存在；已存在时（或并发创建冲突时）直接复用。
      if ! curl -fsS -o /dev/null --header "$AUTH" "$API/releases/testing"; then
        curl -fsS --request POST --header "$AUTH" \
          --header "Content-Type: application/json" \
          --data "{\"name\":\"testing\",\"tag_name\":\"testing\",\"ref\":\"$CI_COMMIT_SHA\",\"description\":\"Latest snapshot builds\"}" \
          "$API/releases" || true
      fi

      # 无论 Release 是否已存在，都删除同名旧链接后重新创建，保证页面上有文件。
      link_id=$(curl -fsS --header "$AUTH" "$API/releases/testing/assets/links" \
        | python3 -c 'import json,sys; name=sys.argv[1]; print(next((str(l["id"]) for l in json.load(sys.stdin) if l["name"] == name), ""))' \
            "$ASSET_NAME")
      if [ -n "$link_id" ]; then
        curl -fsS --request DELETE --header "$AUTH" "$API/releases/testing/assets/links/$link_id"
      fi
      curl -fsS --request POST --header "$AUTH" \
        --header "Content-Type: application/json" \
        --data "{\"name\":\"$ASSET_NAME\",\"url\":\"$PKG_URL\",\"link_type\":\"package\"}" \
        "$API/releases/testing/assets/links"

release-htools:
  extends: .release
  needs:
    - job: cmake-native
      artifacts: true

release-hplatformbox:
  extends: .release
  variables:
    PKG_NAME: hplatformbox
  needs:
    - job: cmake-native-hplatformbox
      artifacts: true

release-test-mingw-i686:
  extends: .release
  variables:
    PKG_NAME: test-mingw-i686
  needs:
    - job: cmake-i686-mingw
      artifacts: true

release-test-mingw-x86_64:
  extends: .release
  variables:
    PKG_NAME: test-mingw-x86_64
  needs:
    - job: cmake-x86_64-mingw
      artifacts: true
