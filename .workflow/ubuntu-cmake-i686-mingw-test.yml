# 对应 .gitea/workflows/ubuntu-cmake-i686-mingw-test.yml
# Gitee Go 自带的 build@gcc 环境较旧（Ubuntu 22.04 的 MinGW-w64 不支持
# std::thread/std::mutex），这里改用 Docker 拉取最新 Ubuntu 镜像交叉编译
# i686 Windows(MinGW-w64)。产物不能在 Linux 构建环境中运行，因此只验证构建和安装。
# 发布使用 Gitee 内置的 release@gitee 插件，无需配置 GITEE_TOKEN。
version: '1.0'
name: ubuntu-cmake-i686-mingw-test
displayName: ubuntu cmake i686 mingw test
triggers:
  trigger: auto
  # 仅在 testing 标签更新时触发，避免每次 Push/PR 都消耗构建额度。
  push:
    tags:
      precise:
        - testing
stages:
  - name: build
    displayName: 构建与安装
    strategy: naturally
    trigger: auto
    executor: []
    steps:
      - step: execute@docker
        name: build_i686_mingw
        displayName: CMake i686 MinGW-w64 构建（Ubuntu 26.04）
        certificate: ''
        # Gitee Go 访问 Docker Hub 不稳定，使用 DaoCloud 公共镜像加速。
        image: docker.m.daocloud.io/library/ubuntu:26.04
        command:
          - set -e
          - bash .workflow/scripts/apt-install.sh build-essential cmake ca-certificates git gcc-mingw-w64-i686 g++-mingw-w64-i686 make ninja-build
          - LDFLAGS='-static -static-libgcc -static-libstdc++' cmake -B build-mingw-i686 -DCMAKE_TOOLCHAIN_FILE="$PWD/test/cmake/toolchain-i686-mingw.cmake" -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$PWD/build-mingw-i686/install" test
          - cmake --build build-mingw-i686 --config Release
          - cmake --build build-mingw-i686 --config Release --target install
          - rm -f test-mingw-i686-snapshot.tar.gz && tar -C build-mingw-i686 -czf test-mingw-i686-snapshot.tar.gz test
        artifacts:
          - name: test-mingw-i686-release
            path:
              - ./test-mingw-i686-snapshot.tar.gz
        caches: []
        notify: []
        strategy:
          retry: '0'
  - name: release
    displayName: 发布
    strategy: naturally
    trigger: auto
    executor: []
    steps:
      - step: release@gitee
        name: release_i686_mingw
        displayName: 发布 MinGW i686 到 Gitee Release
        releaseName: testing
        tagName: testing
        upstreamArtifact:
          - test-mingw-i686-release
        assertFiles:
          - ./test-mingw-i686-snapshot.tar.gz
        prerelease: true
        allowUpdate: true
        notify: []
        strategy:
          retry: '0'
