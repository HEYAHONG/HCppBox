# 对应 .gitea/workflows/ubuntu-cmake-native-test.yml
# Gitee Go 自带的 build@gcc 环境较旧（Ubuntu 22.04），这里改用 Docker
# 拉取最新 Ubuntu 镜像执行构建，以获得新版 GCC/CMake。
# testing 标签更新时会上传 htools 快照到 Gitee Release "testing"；需配置 GITEE_TOKEN 流水线变量。
version: '1.0'
name: ubuntu-cmake-native-test
displayName: ubuntu cmake native test
triggers:
  trigger: auto
  # 仅在 testing 标签更新时触发，避免每次 Push/PR 都消耗构建额度。
  push:
    tags:
      precise:
        - testing
stages:
  - name: build
    displayName: 构建与测试
    strategy: naturally
    trigger: auto
    executor: []
    steps:
      - step: execute@docker
        name: build_native
        displayName: CMake 本地构建与测试（Ubuntu latest）
        certificate: ''
        image: docker.io/library/ubuntu:latest
        command:
          - set -e
          - bash .workflow/scripts/apt-install.sh build-essential cmake ca-certificates curl git jq libopencv-dev libfreetype-dev "libwx*dev" libx11-dev libxext-dev libxkbcommon-dev libwayland-dev libserialport-dev
          - cmake -B build -DCMAKE_BUILD_TYPE=Release test
          - cmake --build build --config Release
          - cmake --build build --config Release -t htools
          - (cd build && ./HBoxTest/HBoxTest)
          - (cd build && ./HRCTest/HRCTest)
          - (cd build && ./HCPPObjectTest/HCPPObjectTest)
          - . /etc/os-release && rm -f "htools-${ID}-${VERSION_ID}-snapshot.tar.gz" && tar -C build -czf "htools-${ID}-${VERSION_ID}-snapshot.tar.gz" htools && bash .workflow/scripts/upload-release-asset.sh "htools-${ID}-${VERSION_ID}-snapshot.tar.gz"
        artifacts:
          - name: htools
            path:
              - ./build/htools
        caches: []
        notify: []
        strategy:
          retry: '0'
