# 对应 .gitea/workflows/ubuntu-cmake-native-test.yml
# Gitee Go 自带的 build@gcc 环境较旧（Ubuntu 22.04），这里改用 Docker
# 拉取最新 Ubuntu 镜像执行构建，以获得新版 GCC/CMake。
# 发布使用 Gitee 内置的 release@gitee 插件，无需配置 GITEE_TOKEN。
version: '1.0'
name: ubuntu-cmake-native-test
displayName: ubuntu cmake native test
triggers:
  trigger: auto
  # 仅在 testing 标签更新时触发，避免每次 Push/PR 都消耗构建额度。
  push:
    tags:
      precise:
        - testing
stages:
  - name: build
    displayName: 构建与测试
    strategy: naturally
    trigger: auto
    executor: []
    steps:
      - step: execute@docker
        name: build_native
        displayName: CMake 本地构建与测试（Ubuntu 26.04）
        certificate: ''
        # Gitee Go 访问 Docker Hub 不稳定，使用 DaoCloud 公共镜像加速。
        image: docker.m.daocloud.io/library/ubuntu:26.04
        command:
          - set -e
          - bash .workflow/scripts/apt-install.sh build-essential cmake ca-certificates curl git python3 libopencv-dev libfreetype-dev "libwx*dev" libx11-dev libxext-dev libxkbcommon-dev libwayland-dev libserialport-dev
          - cmake -B build -DCMAKE_BUILD_TYPE=Release test
          - cmake --build build --config Release
          - cmake --build build --config Release -t htools
          - (cd build && ./HBoxTest/HBoxTest)
          - (cd build && ./HRCTest/HRCTest)
          - (cd build && ./HCPPObjectTest/HCPPObjectTest)
          - rm -f htools-ubuntu-26.04-snapshot.tar.gz && tar -C build -czf htools-ubuntu-26.04-snapshot.tar.gz htools
          - bash .workflow/scripts/fetch-release-body.sh release-body.txt
        artifacts:
          - name: htools-release
            path:
              - ./htools-ubuntu-26.04-snapshot.tar.gz
              - ./release-body.txt
        caches: []
        notify: []
        strategy:
          retry: '0'
  - name: release
    displayName: 发布
    strategy: naturally
    trigger: auto
    executor: []
    steps:
      - step: release@gitee
        name: release_htools
        displayName: 发布 htools 到 Gitee Release
        releaseName: testing
        description: release-body.txt
        tagName: testing
        upstreamArtifact:
          - htools-release
        assertFiles:
          - ./htools-ubuntu-26.04-snapshot.tar.gz
        prerelease: true
        allowUpdate: true
        notify: []
        strategy:
          retry: '0'
