# 对应 .gitea/workflows/ubuntu-scons-native-test.yml
# Gitee Go 自带的 build@gcc 环境较旧（Ubuntu 22.04），这里改用 Docker
# 拉取最新 Ubuntu 镜像使用 SCons 本地构建。
version: '1.0'
name: ubuntu-scons-native-test
displayName: ubuntu scons native test
triggers:
  trigger: auto
  # 仅在 testing 标签更新时触发，避免每次 Push/PR 都消耗构建额度。
  push:
    tags:
      precise:
        - testing
stages:
  - name: build
    displayName: 构建
    strategy: naturally
    trigger: auto
    executor: []
    steps:
      - step: execute@docker
        name: build_scons
        displayName: SCons 本地构建（Ubuntu latest）
        certificate: ''
        image: docker.io/library/ubuntu:latest
        command:
          - set -e
          - bash .workflow/scripts/apt-install.sh build-essential cmake ca-certificates curl git jq scons libopencv-dev libfreetype-dev "libwx*dev" libx11-dev libxext-dev libxkbcommon-dev libwayland-dev libserialport-dev
          - (cd test && scons)
        caches: []
        notify: []
        strategy:
          retry: '0'
