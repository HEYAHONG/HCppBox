# 对应 .gitea/workflows/ubuntu-cmake-native-hplatformbox.yml
# Gitee Go 自带的 build@gcc 环境较旧（Ubuntu 22.04，RISC-V 工具链不支持
# zicsr 扩展），这里改用 Docker 拉取最新 Ubuntu 镜像构建 hplatformbox 固件。
# testing 标签更新时会上传 hplatformbox 快照到 Gitee Release "testing"；需配置 GITEE_TOKEN 流水线变量。
version: '1.0'
name: ubuntu-cmake-native-hplatformbox
displayName: ubuntu cmake native hplatformbox test
triggers:
  trigger: auto
  # 仅在 testing 标签更新时触发，避免每次 Push/PR 都消耗构建额度。
  push:
    tags:
      precise:
        - testing
stages:
  - name: build
    displayName: 构建
    strategy: naturally
    trigger: auto
    executor: []
    steps:
      - step: execute@docker
        name: build_hplatformbox
        displayName: 构建 hplatformbox（Ubuntu latest）
        certificate: ''
        # Gitee Go 访问 Docker Hub 不稳定，使用 DaoCloud 公共镜像加速。
        image: docker.m.daocloud.io/library/ubuntu:latest
        command:
          - set -e
          - bash .workflow/scripts/apt-install.sh build-essential cmake ca-certificates curl git jq sdcc gcc-riscv64-unknown-elf picolibc-riscv64-unknown-elf
          - riscv64-unknown-elf-gcc -specs=picolibcpp.specs --version
          - cmake -B build -DCMAKE_BUILD_TYPE=Release test
          - cmake --build build --config Release -t hplatformbox
          - rm -f hplatformbox-snapshot.tar.gz && tar -C build -czf hplatformbox-snapshot.tar.gz hplatformbox && bash .workflow/scripts/upload-release-asset.sh hplatformbox-snapshot.tar.gz
        artifacts:
          - name: hplatformbox
            path:
              - ./build/hplatformbox
        caches: []
        notify: []
        strategy:
          retry: '0'
